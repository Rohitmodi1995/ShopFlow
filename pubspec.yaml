name: shopflow
description: "A Flutter e-commerce application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # UI
  google_fonts: ^6.3.3
  pinput: ^6.0.2
  shimmer: ^3.0.0

  # State Management
  provider: ^6.1.5+1

  # Network
  http: ^1.6.0
  connectivity_plus: ^7.3.1

  # Firebase
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.8.0
  google_sign_in: ^7.2.0
  firebase_messaging: ^16.6.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.6

  # Payment Gateway
  razorpay_flutter: ^1.4.5
  razorpay_web: ^3.1.3

  # Notifications
  flutter_local_notifications: ^22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/shopflow_app_logo.png"

  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/shopflow_app_logo.png"

  web:
    generate: true
    image_path: "assets/icons/shopflow_app_logo.png"
    background_color: "#FFFFFF"
    theme_color: "#5B3DF5"